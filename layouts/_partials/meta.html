{{ if .IsPage }}

{{ with or (or .Params.author (index (or .Site.Params.author dict) .Section)) "" }}
<span class="author">{{ . }}</span>
{{ end }}

{{ $date := .Date }}
{{ if $date.IsZero }}
    {{ $date = .Lastmod }}
{{ end }}

{{ with $date }}
{{ if not .IsZero }}
<span class="date">{{ . | time.Format "06-01-02" }}</span>
{{ end }}
{{ end }}

{{ end }}
